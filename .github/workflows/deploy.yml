name: Deploy website to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

  # The per-profile pages under u/ are generated at build time from Supabase, so
  # a profile created or edited since the last deploy has no page (or a stale
  # one) until the next build. Two triggers close that window:
  #
  #   schedule            — a floor. Nothing is ever more than an hour stale.
  #   repository_dispatch — the fast path. A Supabase database webhook on
  #                         insert/update of `profiles` POSTs to
  #                         /repos/:owner/:repo/dispatches with
  #                         {"event_type":"profiles-changed"} and the build
  #                         starts within seconds. See web/DEPLOYING.md.
  #
  # The hourly run is what makes the webhook optional rather than load-bearing:
  # if it is never set up, or breaks, profile pages still refresh on their own.
  schedule:
    - cron: '17 * * * *' # hourly, off the hour to dodge the scheduling rush
  repository_dispatch:
    types: [profiles-changed]

  # Called by refresh-characters.yml, which pushes with GITHUB_TOKEN and so
  # cannot trigger this workflow through the `push` event above.
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build and deploy. Defaults to the triggering ref.'
        type: string
        required: false
        default: ''

permissions:
  contents: read

# allow one concurrent deployment
concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

# Built here rather than by Cloudflare's own Git integration so every trigger
# above (push, hourly schedule, Supabase webhook, the character refresh) keeps
# working. wrangler uploads dist/ plus web/functions (the showcase preview
# Function). Needs two repository secrets besides the Supabase ones:
#   CLOUDFLARE_API_TOKEN   — a token with "Cloudflare Pages: Edit"
#   CLOUDFLARE_ACCOUNT_ID  — from the Cloudflare dashboard sidebar
# See web/DEPLOYING.md.
jobs:
  deploy:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # empty for push / workflow_dispatch, which checks out the triggering ref
          ref: ${{ inputs.ref }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install
        run: npm ci

      - name: Build Astro site
        run: npm run build
        env:
          # add these under GitHub → Settings → Secrets and variables → Actions
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          workingDirectory: web
          # --branch=main makes it the production deployment, whichever ref was built
          command: pages deploy dist --project-name=otakulist --branch=main
