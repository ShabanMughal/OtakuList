name: Deploy website to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

  # The per-profile pages under u/ are generated at build time from Supabase, so
  # a profile created or edited since the last deploy has no page (or a stale
  # one) until the next build. Two triggers close that window:
  #
  #   schedule            — a floor. Nothing is ever more than an hour stale.
  #   repository_dispatch — the fast path. A Supabase database webhook on
  #                         insert/update of `profiles` POSTs to
  #                         /repos/:owner/:repo/dispatches with
  #                         {"event_type":"profiles-changed"} and the build
  #                         starts within seconds. See web/DEPLOYING.md.
  #
  # The hourly run is what makes the webhook optional rather than load-bearing:
  # if it is never set up, or breaks, profile pages still refresh on their own.
  schedule:
    - cron: '17 * * * *' # hourly, off the hour to dodge the scheduling rush
  repository_dispatch:
    types: [profiles-changed]

  # Called by refresh-characters.yml, which pushes with GITHUB_TOKEN and so
  # cannot trigger this workflow through the `push` event above.
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build and deploy. Defaults to the triggering ref.'
        type: string
        required: false
        default: ''

permissions:
  contents: read
  pages: write
  id-token: write

# allow one concurrent deployment
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # empty for push / workflow_dispatch, which checks out the triggering ref
          ref: ${{ inputs.ref }}
      - name: Build Astro site
        uses: withastro/action@v3
        with:
          path: web
        env:
          # add these under GitHub → Settings → Secrets and variables → Actions
          PUBLIC_SUPABASE_URL: ${{ secrets.PUBLIC_SUPABASE_URL }}
          PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.PUBLIC_SUPABASE_ANON_KEY }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
